services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wgg-site:latest
    container_name: wgg-site
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wgg-api:latest
    container_name: wgg-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: wgg_wedding
      DB_USER: wgg_app
      DB_PASSWORD_FILE: /run/secrets/mysql_app_password
      ADMIN_BOOTSTRAP_USERNAME: admin
      ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/admin_password
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_USER: d.singine@gmail.com
      SMTP_PASSWORD_FILE: /run/secrets/gmail_app_password
      NOTIFICATION_EMAIL: d.singine@gmail.com
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "3000"
    secrets:
      - mysql_app_password
      - admin_password
      - gmail_app_password
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  database:
    image: m.daocloud.io/docker.io/library/mysql:8.4
    container_name: wgg-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: wgg_wedding
      MYSQL_USER: wgg_app
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    secrets:
      - mysql_app_password
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

volumes:
  mysql_data:

secrets:
  mysql_app_password:
    file: ./secrets/mysql_app_password.txt
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
  gmail_app_password:
    file: ./secrets/gmail_app_password.txt
