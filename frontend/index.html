<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="wagaga.top is getting ready.">
  <title>wagaga.top · Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090b;
      color: #fafafa;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 58, 237, .24), transparent 35%),
        radial-gradient(circle at 80% 75%, rgba(14, 165, 233, .18), transparent 32%),
        #09090b;
    }

    main {
      width: min(760px, calc(100% - 40px));
      padding: 64px 48px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 28px;
      background: rgba(24, 24, 27, .72);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .45);
      backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 999px;
      color: #d4d4d8;
      font-size: 14px;
      letter-spacing: .04em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 18px #34d399;
    }

    h1 {
      margin: 30px 0 18px;
      font-size: clamp(44px, 10vw, 88px);
      line-height: .95;
      letter-spacing: -.065em;
    }

    p {
      max-width: 520px;
      margin: 0 auto;
      color: #a1a1aa;
      font-size: clamp(17px, 2.5vw, 20px);
      line-height: 1.75;
    }

    footer {
      margin-top: 40px;
      color: #71717a;
      font-size: 13px;
    }

    @media (max-width: 560px) {
      main { padding: 48px 24px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge"><span class="dot"></span> Website online</div>
    <h1>wagaga.top</h1>
    <p>新网站正在准备中。服务器和自动部署流程已经就绪，精彩内容很快上线。</p>
    <footer>Powered by Docker &amp; Nginx</footer>
  </main>
</body>
</html>
