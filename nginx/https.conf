limit_req_zone $binary_remote_addr zone=rsvp_submit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wagaga.top;

    ssl_certificate /etc/letsencrypt/live/wagaga.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wagaga.top/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wedding.wagaga.top;

    ssl_certificate /etc/letsencrypt/live/wagaga.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wagaga.top/privkey.pem;

    root /usr/share/nginx/wedding;
    index index.html;
    charset utf-8;

    location = /api/submissions {
        limit_req zone=rsvp_submit burst=5 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:3000/submissions;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name db.wagaga.top;

    ssl_certificate /etc/letsencrypt/live/wagaga.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wagaga.top/privkey.pem;

    root /usr/share/nginx/admin;
    index index.html;
    charset utf-8;

    location = /api/login {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:3000/admin/login;
    }

    location /api/ {
        client_max_body_size 16k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:3000/admin/;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
    }

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
